# direnv — global config
# Loaded by direnv on every shell that has run the `direnv hook zsh` line.
# Source for this file: ~/Dev/Personal/dotfiles/dot_config/direnv/direnv.toml
# (managed via chezmoi). Edit via `chezmoi edit ~/.config/direnv/direnv.toml`.

[global]
# Tighten the "this load took ages" warning. Default is 5s — too noisy for
# devbox-backed projects on a cold cache where Nix pulls realising a JDK or
# Postgres can briefly cross that threshold. 30s catches genuine pathology
# without crying wolf on a clean machine's first cd into a new project.
warn_timeout = "30s"

# Skip direnv's per-export diff log on cd. The hook still runs everything;
# we just don't print every `+VAR=...` line. With devbox + project secrets
# from 1Password the log gets long and obscures the actual command output.
hide_env_diff = true

[whitelist]
# Auto-trust .envrc files under these roots. Without this, every fresh
# clone needs a one-time `direnv allow` before its devbox activation fires.
# Listing the dirs you actually keep projects under removes that friction.
#
# Security note: anything you `git clone` into one of these dirs will load
# its .envrc on first cd-in. The risk model is "I trust the source I'm
# cloning from" — which matches how you'd treat an unknown shell script
# in a repo anyway. If you're auditing an untrusted repo, clone to /tmp
# (not whitelisted) or temporarily move the .envrc aside before cd-ing.
prefix = [
    "~/Dev",
]
