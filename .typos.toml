# typos — spell-checker config, used by both the `typos` CI job
# (.github/workflows/ci.yml) and the `typos` pre-commit hook.
# Run locally: brew install typos-cli && typos
#
# Keep this file minimal: only add an entry when `typos` flags something that
# is genuinely correct — a real technical word, or a vendor file whose contents
# we don't control. Don't allowlist an actual misspelling.

[files]
# Machine-managed / vendor files: their contents aren't hand-written, so any
# "typo" in them is noise we can't fix at the source.
extend-exclude = [
    # Neovim plugin lock — plugin names + commit hashes, regenerated by lazy.nvim.
    "src/exact_dot_config/nvim/lazy-lock.json",
]

# Real words that typos' dictionary misreads as typos. Lowercase is enough —
# case-folding is automatic, so `aks` also covers AKS/Aks. Each entry maps the
# word to itself (i.e. "this is correct, leave it alone").
[default.extend-words]
aks = "aks"      # Azure Kubernetes Service
hashi = "hashi"  # typos splits CamelCase "HashiCorp" into Hashi+Corp (Brewfile.work)
jod = "jod"      # Node.js LTS codename (Node 24 = "Jod")
