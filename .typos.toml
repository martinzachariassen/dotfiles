# typos — spell-checker config; used by CI (typos job) and the pre-commit hook.
# Run locally: brew install typos-cli && typos
#
# Keep minimal: only allowlist genuine words or vendor files we don't control —
# never an actual misspelling.

[files]
# Vendor/machine-generated files — contents aren't hand-written, so "typos" here are noise.
extend-exclude = [
    # Neovim plugin lock — plugin names + commit hashes, regenerated by lazy.nvim.
    "src/dot_config/nvim/lazy-lock.json",
]

# Case-folding is automatic — lowercase `aks` also covers AKS/Aks.
[default.extend-words]
aks = "aks"      # Azure Kubernetes Service
hashi = "hashi"  # typos splits CamelCase "HashiCorp" into Hashi+Corp (Brewfile.work)
jod = "jod"      # Node.js LTS codename (Node 24 = "Jod")
