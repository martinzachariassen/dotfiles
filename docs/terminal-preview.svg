<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">dotfiles setup preview</title>
  <desc id="desc">Animated terminal preview showing the setup flow: one install command, machine bootstrap, post-install auth, and the ready workstation.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303446"/>
      <stop offset="1" stop-color="#232634"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#414559"/>
      <stop offset="1" stop-color="#292c3c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#11111b" flood-opacity=".35"/>
    </filter>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, monospace; }
      .ui { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .panel { opacity: 0; }
      .muted { fill: #a5adce; }
      .text { fill: #c6d0f5; }
      .green { fill: #a6d189; }
      .blue { fill: #8caaee; }
      .cyan { fill: #81c8be; }
      .rose { fill: #f2d5cf; }
      .yellow { fill: #e5c890; }
    </style>
  </defs>

  <rect width="960" height="520" fill="#c6d0f5"/>
  <rect x="54" y="48" width="852" height="424" rx="18" fill="url(#frame)" filter="url(#shadow)"/>
  <rect x="54" y="48" width="852" height="54" rx="18" fill="#292c3c"/>
  <path d="M54 84h852v18H54z" fill="#292c3c"/>

  <circle cx="88" cy="75" r="8" fill="#e78284"/>
  <circle cx="114" cy="75" r="8" fill="#e5c890"/>
  <circle cx="140" cy="75" r="8" fill="#a6d189"/>
  <text x="480" y="81" text-anchor="middle" class="mono muted" font-size="15">fresh-mac — dotfiles bootstrap</text>

  <g class="ui">
    <text x="92" y="135" class="rose" font-size="18" font-weight="700">From a clean macOS install to a signed-in dev workstation</text>
    <text x="92" y="160" class="muted" font-size="14">The installer does machine setup first. Account auth and git signing happen after the tools exist.</text>
  </g>

  <g class="mono" font-size="18">
    <g class="panel">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.22;0.28;1" dur="12s" repeatCount="indefinite"/>
      <text x="92" y="215" class="green">➜</text>
      <text x="126" y="215" class="blue">start</text>
      <text x="202" y="215" class="text">curl -fsSL .../install.sh | bash</text>

      <rect x="92" y="246" width="776" height="154" rx="8" fill="url(#stage)" stroke="#626880"/>
      <text x="126" y="286" class="cyan">◆</text>
      <text x="162" y="286" class="rose">Fresh setup asks only for what exists now</text>
      <text x="126" y="326" class="green">✓</text>
      <text x="162" y="326" class="text">profile, git name, git email</text>
      <text x="126" y="362" class="yellow">!</text>
      <text x="162" y="362" class="text">signing waits until 1Password is installed</text>
    </g>

    <g class="panel">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.30;0.48;0.54;1" dur="12s" repeatCount="indefinite"/>
      <text x="92" y="215" class="green">✓</text>
      <text x="126" y="215" class="text">Machine bootstrap</text>

      <rect x="92" y="246" width="776" height="154" rx="8" fill="url(#stage)" stroke="#626880"/>
      <text x="126" y="286" class="green">✓</text>
      <text x="162" y="286" class="text">Xcode CLT, Homebrew, chezmoi, Devbox</text>
      <text x="126" y="326" class="green">✓</text>
      <text x="162" y="326" class="text">Brewfiles install packages with per-item progress</text>
      <text x="126" y="362" class="green">✓</text>
      <text x="162" y="362" class="text">dotfiles, VS Code extensions, macOS defaults</text>
    </g>

    <g class="panel">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.56;0.72;0.78;1" dur="12s" repeatCount="indefinite"/>
      <text x="92" y="215" class="green">➜</text>
      <text x="126" y="215" class="blue">next</text>
      <text x="202" y="215" class="text">bash scripts/bootstrap-auth.sh</text>

      <rect x="92" y="246" width="776" height="154" rx="8" fill="url(#stage)" stroke="#626880"/>
      <text x="126" y="286" class="cyan">◆</text>
      <text x="162" y="286" class="rose">Account setup happens after install</text>
      <text x="126" y="326" class="green">✓</text>
      <text x="162" y="326" class="text">1Password SSH agent, GitHub auth, git signing test</text>
      <text x="126" y="362" class="green">✓</text>
      <text x="162" y="362" class="text">Azure/GCP auth only when the work profile tools exist</text>
    </g>

    <g class="panel">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76;0.82;1" dur="12s" repeatCount="indefinite"/>
      <text x="92" y="215" class="green">✓</text>
      <text x="126" y="215" class="text">Ready</text>

      <rect x="92" y="246" width="776" height="154" rx="8" fill="url(#stage)" stroke="#626880"/>
      <text x="126" y="286" class="green">✓</text>
      <text x="162" y="286" class="text">Ghostty, Zellij, Starship, zsh, modern CLI tools</text>
      <text x="126" y="326" class="green">✓</text>
      <text x="162" y="326" class="text">Devbox + direnv keep project toolchains pinned</text>
      <text x="126" y="362" class="green">✓</text>
      <text x="162" y="362" class="text">Personal stays lean; work profile adds cloud tooling</text>
    </g>
  </g>

  <g transform="translate(92 430)" class="ui">
    <circle cx="0" cy="0" r="5" fill="#81c8be">
      <animate attributeName="opacity" values="1;1;.35;.35" keyTimes="0;0.22;0.28;1" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="24" cy="0" r="5" fill="#81c8be">
      <animate attributeName="opacity" values=".35;.35;1;1;.35;.35" keyTimes="0;0.24;0.30;0.48;0.54;1" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="48" cy="0" r="5" fill="#81c8be">
      <animate attributeName="opacity" values=".35;.35;1;1;.35;.35" keyTimes="0;0.50;0.56;0.72;0.78;1" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="72" cy="0" r="5" fill="#81c8be">
      <animate attributeName="opacity" values=".35;.35;1;1" keyTimes="0;0.76;0.82;1" dur="12s" repeatCount="indefinite"/>
    </circle>
    <text x="112" y="5" fill="#a5adce" font-size="13">install → packages → auth → ready</text>
  </g>
</svg>
