<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">dotfiles terminal preview</title>
  <desc id="desc">A stylized terminal showing the dotfiles setup commands and prompt.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303446"/>
      <stop offset="1" stop-color="#232634"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#11111b" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="#c6d0f5"/>
  <rect x="54" y="48" width="852" height="424" rx="18" fill="url(#frame)" filter="url(#shadow)"/>
  <rect x="54" y="48" width="852" height="54" rx="18" fill="#292c3c"/>
  <path d="M54 84h852v18H54z" fill="#292c3c"/>

  <circle cx="88" cy="75" r="8" fill="#e78284"/>
  <circle cx="114" cy="75" r="8" fill="#e5c890"/>
  <circle cx="140" cy="75" r="8" fill="#a6d189"/>
  <text x="480" y="81" text-anchor="middle" fill="#b5bfe2" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="15">~/Developer/personal/dotfiles</text>

  <g font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="20">
    <text x="92" y="148" fill="#a6d189">➜</text>
    <text x="126" y="148" fill="#8caaee">setup</text>
    <text x="212" y="148" fill="#c6d0f5">curl -fsSL .../install.sh | bash</text>

    <text x="126" y="198" fill="#81c8be">╭────────────────────────────────────────────╮</text>
    <text x="126" y="232" fill="#81c8be">│</text>
    <text x="162" y="232" fill="#f2d5cf">Dotfiles Setup</text>
    <text x="694" y="232" fill="#81c8be">│</text>
    <text x="126" y="266" fill="#81c8be">│</text>
    <text x="162" y="266" fill="#c6d0f5">Fresh macOS workstation bootstrap.</text>
    <text x="694" y="266" fill="#81c8be">│</text>
    <text x="126" y="300" fill="#81c8be">╰────────────────────────────────────────────╯</text>

    <text x="126" y="350" fill="#81c8be">◆</text>
    <text x="162" y="350" fill="#f2d5cf">2/5 - Choose setup</text>
    <text x="126" y="386" fill="#81c8be">│</text>
    <text x="162" y="386" fill="#c6d0f5">Fresh installs only need profile, name, email.</text>
    <text x="126" y="422" fill="#a6d189">✓</text>
    <text x="162" y="422" fill="#c6d0f5">Git signing finishes after 1Password sign-in.</text>

    <rect x="750" y="404" width="12" height="24" fill="#f2d5cf">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
