# Pre-commit hooks mirroring the CI jobs in .github/workflows/ci.yml. All use
# language: system so they run the brew/mise-installed binaries, not managed copies.
# Activate: pre-commit install --install-hooks
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, commit-msg]

fail_fast: false

repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (severity=error)
        entry: shellcheck --severity=error --shell=bash
        language: system
        files: '^(install\.sh|scripts/.*\.sh)$'

      - id: shfmt
        name: shfmt (-i 4 -ci)
        entry: shfmt -d -i 4 -ci
        language: system
        files: '^(install\.sh|scripts/.*\.sh)$'

      # bash/zsh -n only parses its first argument, so loop over files manually.
      - id: bash-syntax
        name: bash -n
        entry: bash -c 'for f; do bash -n "$f"; done' --
        language: system
        files: '^(install\.sh|scripts/.*\.sh)$'

      # dot_zshrc.tmpl is excluded — chezmoi {{ }} syntax breaks zsh -n.
      - id: zsh-syntax
        name: zsh -n
        entry: bash -c 'for f; do zsh -n "$f"; done' --
        language: system
        files: '^src/(dot_zshenv|dot_config/zsh/dot_zprofile)$'

      - id: typos
        name: typos
        entry: typos
        language: system
        pass_filenames: false

      - id: lint-config
        name: lint-config (JSON/TOML)
        entry: bash scripts/ci/lint-config.sh
        language: system
        pass_filenames: false

      - id: gitleaks
        name: gitleaks (secret scan)
        entry: gitleaks dir . --redact --no-banner
        language: system
        pass_filenames: false

      - id: actionlint
        name: actionlint (workflow lint)
        entry: actionlint
        language: system
        pass_filenames: false
        files: '^\.github/(workflows|actions)/.*\.ya?ml$'

      # Offline locally (fast); CI runs it online to also verify action pins.
      - id: zizmor
        name: zizmor (workflow audit)
        entry: zizmor --offline .github/workflows/
        language: system
        pass_filenames: false
        files: '^\.github/workflows/.*\.ya?ml$'

      # Enforces Conventional Commits for direct-to-main commits (CI only checks PR titles).
      - id: conventional-commit
        name: Conventional Commits subject
        stages: [commit-msg]
        entry: bash scripts/ci/check-commit-msg.sh
        language: system
