# Optional-module catalog — the one place the module list + human labels live.
#
# Selected at `chezmoi init` via a single promptMultichoiceOnce in
# .chezmoi.toml.tmpl; the chosen names land in `.modules` (a list). Templates gate
# on membership with sprig `has`, e.g. {{ if has "theme" .modules }}...{{ end }}.
# Prompts, the doctor report, and the apply summary all read these labels so the
# list is never restated.
#
# Keep this namespace (`moduleCatalog`) disjoint from prompted answers — see the
# note in packages.toml.

[moduleCatalog]
macApps = "GUI and AI apps (Raycast, Obsidian, Chrome, Claude)"
macosDefaults = "macOS system defaults (needs sudo)"
cloudAuth = "Cloud CLIs and auth walkthrough (gh, az, gcloud, op)"
obsidian = "Obsidian vault seeding and starter content"
claudePersona = "Claude persona at ~/.config/claude/CLAUDE.md"
devcontainer = "Dev container template under templates/"
theme = "Catppuccin Frappe across terminal and editor"
locale = "Norwegian locale (cSpell nb, bokmal dictionary)"
jvmStack = "JVM runtimes via mise (Temurin, Kotlin, Maven, Gradle)"

# Per-profile default module selection the wizard (scripts/wizard.sh) pre-checks.
# This MUST mirror the $defaults blocks in .chezmoi.toml.tmpl — the config
# template is rendered before .chezmoidata loads, so it can't read this table and
# has to restate the same lists literally. tests/data-model.bats enforces the
# match so the two never drift. Keys must be [moduleCatalog] names.
[profileDefaults]
personal = ["claudePersona", "jvmStack", "locale", "macApps", "macosDefaults", "obsidian", "theme"]
work = ["claudePersona", "cloudAuth", "jvmStack", "macApps", "macosDefaults", "theme"]
minimal = []
