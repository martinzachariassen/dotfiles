# Every key must stay: the template replaces colima's defaults instead of
# merging, so a removed line starts the VM with that value zeroed.
cpu: 4
disk: 100
memory: 8
arch: host # not aarch64: must be right on an Intel mac too
runtime: docker
modelRunner: docker
network:
  mode: shared
  interface: en0
  gatewayAddress: 192.168.5.2
mounts: []

sshConfig: false
