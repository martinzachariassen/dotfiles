# Starship prompt — managed by chezmoi. https://starship.rs/config/

palette = "catppuccin_mocha"

format = """
$directory\
$git_branch$git_status\
$java$kotlin$nodejs$python\
$terraform$docker_context\
$kubernetes$azure$gcloud\
$cmd_duration\
$line_break\
$character"""

add_newline = true
command_timeout = 2000

# ── Prompt character ──────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold mauve)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"

# ── Directory ─────────────────────────────────────────────────────────────────
[directory]
style              = "bold blue"
truncation_length  = 3
truncation_symbol  = "…/"
read_only          = " 󰌾"
read_only_style    = "red"
home_symbol        = "~"
format             = "[$path]($style)[$read_only]($read_only_style) "

# ── Git ───────────────────────────────────────────────────────────────────────
[git_branch]
symbol            = " "
style             = "lavender"
truncation_length = 32
format            = "on [$symbol$branch]($style) "

[git_status]
style       = "peach"
ahead       = "⇡${count} "
behind      = "⇣${count} "
diverged    = "⇕⇡${ahead_count}⇣${behind_count} "
modified    = "!${count} "
untracked   = "?${count} "
stashed     = "≡ "
staged      = "+${count} "
conflicted  = "✗ "
format      = "[$all_status$ahead_behind]($style)"

# ── Languages ─────────────────────────────────────────────────────────────────
[java]
symbol = " "
style  = "red"
format = "via [$symbol($version )]($style)"

[kotlin]
symbol = " "
style  = "mauve"
format = "via [$symbol($version )]($style)"

[nodejs]
symbol = " "
style  = "green"
format = "via [$symbol($version )]($style)"

[python]
symbol  = " "
style   = "yellow"
format  = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

# ── Tooling context ───────────────────────────────────────────────────────────
[terraform]
symbol = "󱁢 "
style  = "mauve"
format = "via [$symbol$workspace]($style) "

[docker_context]
symbol = " "
style  = "blue"
format = "via [$symbol$context]($style) "

# ── Cloud / cluster context ───────────────────────────────────────────────────
[kubernetes]
symbol     = "⎈ "
style      = "teal"
disabled   = false
format     = '[$symbol$context( ($namespace))]($style) '
# Only surface in dirs that actually touch k8s, not everywhere.
detect_files     = ["k8s.yaml", "k8s.yml", "kustomization.yaml", "Chart.yaml", "skaffold.yaml"]
detect_folders   = ["k8s", "kubernetes", "manifests", "charts"]

[azure]
symbol   = "󰠅 "
style    = "blue"
format   = '[$symbol($subscription)]($style) '
disabled = false

[gcloud]
symbol   = "󱇶 "
style    = "lavender"
format   = '[($symbol$account)(@$domain)( \($project\)) ]($style)'
detect_env_vars = ["CLOUDSDK_CORE_ACCOUNT", "GOOGLE_CLOUD_PROJECT"]
disabled = false

[aws]
disabled = true

# ── Command duration ──────────────────────────────────────────────────────────
[cmd_duration]
min_time         = 2_000
format           = "took [$duration](peach) "
show_milliseconds = false

# ── Modules turned off ────────────────────────────────────────────────────────
[battery]
disabled = true

[time]
disabled = true

[hostname]
disabled = true

[username]
disabled = true

# ── Catppuccin Mocha palette ──────────────────────────────────────────────────
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
