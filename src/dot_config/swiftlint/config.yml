# ~/.config/swiftlint/config.yml — global SwiftLint defaults (appleDev module).
# Unlike SwiftFormat, SwiftLint doesn't auto-discover $HOME configs and there's no
# maintained VS Code extension left to wire it in — invoke it explicitly, from an
# Xcode Run Script build phase or pre-commit: `swiftlint --config ~/.config/swiftlint/config.yml`.
# Prefer a project's own .swiftlint.yml when present instead of passing --config.

disabled_rules:
  - todo # intentional notes, not violations
  - trailing_whitespace # SwiftFormat owns this
  - modifier_order # SwiftFormat enforces this on save; warn-only here just double-reports

opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - last_where
  - contains_over_first_not_nil
  - sorted_first_last
  - force_unwrapping # a common crash source
  - explicit_init
  - closure_spacing
  - collection_alignment
  - fatal_error_message
  - operator_usage_whitespace
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - toggle_bool

# Aligned with SwiftFormat --maxwidth 120; error threshold left roomy on purpose.
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 2
  excluded: [id, x, y, i, j, to, in]

type_name:
  min_length: 3
  max_length: 50

# Only run under `swiftlint analyze` (needs a compiler log); harmless otherwise.
analyzer_rules:
  - unused_import
  - unused_declaration
