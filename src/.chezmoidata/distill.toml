# chezdistill — nightly distillation of Claude Code transcripts into the memory
# tier every future session loads. Read by scripts/lib/distill.sh via
# `chezmoi data`, the same way clean.sh reads cleanup.toml.
#
# .chezmoidata can't be templated; keep this namespace disjoint from prompted
# answers (packages.toml/modules.toml) so merges don't collide.
#
# The corpus remote is NOT here and must not come back. This repo is public, so a
# table of corpus URLs is two private repo names shipped to everyone who clones
# it, and a default a fork inherits and cannot use. It is a prompted answer
# (`corpusRemote`, blank by default) that only ever SEEDS a state repo with no
# origin; from then on git's own origin is the authority and `corpus.json` is the
# guard. See docs/distill.md.

[distill]
# Two destinations, because the two have nothing in common. See docs/ai.md.
#
# memoryPath is what Claude loads: the persona @-imports MAIN.md from here.
# statePath is the extract corpus, the hand-written Pinned.md, the cursor, spend
# and run log. The extracts ARE the memory — every rule and hit count is derived
# from them — so this is the directory worth backing up. Both are ordinary local
# directories and are created on demand.
memoryPath = "~/.config/claude/memory"
statePath = "~/.local/state/chezdistill"

# Where transcripts live. A list so a second Claude Code install can be added
# without touching the code. Tildes are expanded by the reader, and a root that
# does not exist is skipped — so listing both costs nothing.
#
# BOTH, and ~/.claude/projects first, because CLAUDE_CONFIG_DIR does NOT move
# them. It relocates settings, skills and the persona; `projects/` (and
# history.jsonl, shell-snapshots, todos) stay under ~/.claude regardless. This
# file shipped with only the XDG path, which has never existed on any machine
# here, so the nightly job read zero transcripts and reported `ok` every night —
# see distill_sources_ok in scripts/lib/distill.sh, which now refuses to let a
# run with nowhere to read from pass as a quiet night.
transcriptRoots = ["~/.claude/projects", "~/.config/claude/projects"]

# The one model tier. One call per session — `items: []` is itself the "nothing
# durable here" verdict. A separate cheap triage pass measured WORSE: it cost
# $0.05/session while saving a $0.23 map call only sometimes, because every call
# re-pays ~19k tokens of cached harness context. The free gate is `minTurns`.
mapModel = "sonnet"

# Cost brakes. maxBudgetUsd caps a single `claude -p`; maxSpendUsd7d is a rolling
# ceiling read from spend.jsonl and checked in preflight, so a runaway can't
# quietly bill for a week before anyone notices.
maxBudgetUsd = 2.0
maxSpendUsd7d = 25.0

# Sessions with fewer than this many typed human turns are dropped in bash,
# before any model call.
minTurns = 3

# MAIN.md budget. Every byte here is paid for in EVERY session, forever — that's
# why the cap is enforced in bash and not left to the model.
mainCapBytes = 6144

# Promotion gate: an entry must be seen in this many distinct sessions before it
# is rendered into MAIN.md. Below the bar it sits in Candidates.md, where
# it affects nothing. This is what stops one misreading becoming a global rule.
minHits = 2

# Eviction: entries not reinforced for this long, and still under minHits, are
# demoted from MAIN.md to Topics/. Demotion never deletes.
demoteAfterDays = 21

# Run log. Every run appends one record to runs.jsonl — read back by
# `chezdistill --status`, so a night the job skipped everything is still visible
# rather than leaving its only trace in a launchd log.
runRetentionDays = 90

# Extracts hold the DISTILLED item — a model-written rule and explanation — plus
# one short `evidence` quote and the `cwd` it came from. After this many days the
# quote and the path are stripped; the rule itself is kept forever, because `hits`
# and `first_seen` are derived from the corpus and deleting an old sighting would
# evict an established rule from MAIN.md.
extractRetentionDays = 90
