# chezdistill — nightly/weekly distillation of Claude Code transcripts into the
# Obsidian vault. Read by scripts/lib/distill.sh via `chezmoi execute-template`,
# the same way clean.sh reads cleanup.toml.
#
# .chezmoidata can't be templated; keep this namespace disjoint from prompted
# answers (packages.toml/modules.toml) so merges don't collide.

[distill]
# The vault is NOT chezmoi-managed and is never created by the job — preflight
# refuses to run when any of these is missing. See docs/ai.md.
vaultPath = "~/Documents/TheArchive"
folder = "30-Claude"

# Where transcripts live. A list because storecode (work profile) has Claude Code
# underneath and may write elsewhere; verify with `chezdistill --status` on that
# machine before trusting its reports. Tildes are expanded by the reader.
transcriptRoots = ["~/.config/claude/projects"]

# Model tiers. One call per session — `items: []` is itself the "nothing durable
# here" verdict. A separate cheap triage pass measured WORSE: it cost $0.05/session
# while saving a $0.23 map call only sometimes, because every call re-pays ~19k
# tokens of cached harness context. The free gate is `minTurns` below.
mapModel = "sonnet"
narrateModel = "opus"

# Cost brakes. maxBudgetUsd caps a single `claude -p`; maxSpendUsd7d is a rolling
# ceiling summed across every machine's .state/spend/<host>.jsonl and checked in
# preflight, so a runaway can't quietly bill for a week.
maxBudgetUsd = 2.0
maxSpendUsd7d = 25.0

# Sessions with fewer than this many typed human turns are dropped in bash,
# before any model call.
minTurns = 3

# MAIN.md budget. Every byte here is paid for in EVERY session on both machines,
# forever — that's why the cap is enforced in bash and not left to the model.
mainCapBytes = 6144

# Promotion gate: an entry must be seen in this many distinct sessions before it
# is rendered into MAIN.md. Below the bar it sits in Inbox/Candidates.md, where
# it affects nothing. This is what stops one misreading becoming a global rule.
minHits = 2

# Eviction: entries not reinforced for this long, and still under minHits, are
# demoted from MAIN.md to Topics/. Demotion never deletes.
demoteAfterDays = 21

# Run log. Every run appends one record to .state/runs/<host>.jsonl and Runs.md
# is re-rendered from all of them, so the Mac you are not using is visible too.
# runsShown bounds the table; runRetentionDays bounds the records behind it.
runsShown = 30
runRetentionDays = 90

# Extracts hold near-verbatim conversation text and must be committed so the two
# machines can merge. This bounds how long that text is kept.
extractRetentionDays = 90

# ─── Origin classification ────────────────────────────────────────────────────
# Resolved once, at harvest, on the machine that still has the repo on disk:
#   1. git remote matches workRemotes  → work
#   2. path prefix matches workPaths   → work
#   3. path prefix matches personalPaths → personal
#   4. otherwise                       → unknown
#
# `unknown` is deliberately loud: those entries go to Inbox/Candidates.md and are
# NEVER rendered into MAIN.md or a scoped section, so a missing pattern shows up
# as a visible pile rather than as Storebrand material quietly filed as personal.
# `chezdistill --status` lists every remote and path that matched nothing.
#
# Substring match against `git remote get-url origin`. Fill this in on the work
# machine — until then its repos classify as unknown, which is the safe direction.
workRemotes = []
workPaths = []
personalPaths = ["~/Developer/personal"]
