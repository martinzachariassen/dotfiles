# Optional-module catalog — the single source for module names + labels. Selected
# at `chezmoi init`; chosen names land in `.modules` and templates gate with
# `{{ if has "theme" .modules }}`. Keep the `moduleCatalog` namespace disjoint
# from prompted answers (see packages.toml).

[moduleCatalog]
macApps = "GUI and AI apps (Raycast, Chrome, Claude)"
macosDefaults = "macOS system defaults (needs sudo)"
cloudAuth = "Cloud CLIs and auth walkthrough (gh, az, gcloud, op)"
claudePersona = "Claude persona at ~/.config/claude/CLAUDE.md"
theme = "Catppuccin Frappe across terminal and editor"
locale = "Norwegian locale (cSpell nb, bokmal dictionary)"
jvmStack = "JVM runtimes via mise (Temurin, Kotlin, Maven, Gradle)"

# Wizard's per-profile pre-checks, composed as: effective = (inherit ? base : []) ∪ extra.
# .chezmoi.toml.tmpl restates each profile's effective list literally (it renders
# before .chezmoidata loads); tests/data-model.bats enforces the two match. Every
# name must be a [moduleCatalog] key.
[profileDefaults]
base = ["claudePersona", "jvmStack", "locale", "macApps", "macosDefaults", "theme"]

# Whether a profile starts from `base`; minimal is the deliberately-empty one.
[profileDefaults.inherit]
personal = true
work = true
minimal = false

# Per-profile additions layered on top of the inherited base.
[profileDefaults.extra]
personal = []
work = ["cloudAuth"]
minimal = []
