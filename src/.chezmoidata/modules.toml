# Optional-module catalog — module names + labels selected at `chezmoi init`;
# templates gate with `{{ if has "theme" .modules }}`. Keep this namespace
# disjoint from prompted answers (packages.toml) so merges don't collide.

[moduleCatalog]
macApps = "GUI and AI apps (Raycast, Chrome, Claude)"
macosDefaults = "macOS system defaults (needs sudo)"
cloudAuth = "Cloud CLIs and auth walkthrough (gh, az, gcloud, op)"
claudePersona = "Claude persona at ~/.config/claude/CLAUDE.md"
claudeDistiller = "Nightly distillation of Claude sessions into a persistent memory"
theme = "Catppuccin Mocha across terminal and editor"
locale = "Norwegian locale (cSpell nb, bokmal dictionary)"
jvmStack = "JVM runtimes via mise (Temurin, Kotlin, Maven, Gradle)"
appleDev = "Swift/iOS dev (SwiftLint, SwiftFormat, xcbeautify, xcodes, fastlane)"

# The boxes the wizard pre-ticks on a fresh Mac. A suggestion, not a gate:
# nothing reads this at apply time, and unticking any of it is a normal answer.
#
# One list, not one per machine kind. This used to be [profileDefaults] — a
# base set, an inherit flag and a per-profile extra list, three tables to say
# "personal gets appleDev and work gets cloudAuth". Every module is already
# independent, so the profile only decided which boxes started ticked; that is
# a default, and a default does not need an axis.
#
# cloudAuth is the one catalog entry deliberately left off: it is the only
# module whose walkthrough needs credentials you may not have.
#
# .chezmoi.toml.tmpl restates this literally (it renders before .chezmoidata
# loads); tests/data-model.bats enforces the two match.
[recommended]
modules = ["appleDev", "claudeDistiller", "claudePersona", "jvmStack", "locale", "macApps", "macosDefaults", "theme"]
