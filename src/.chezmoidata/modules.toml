# Optional-module catalog — module names + labels selected at `chezmoi init`;
# templates gate with `{{ if has "theme" .modules }}`. Keep this namespace
# disjoint from prompted answers (packages.toml) so merges don't collide.

[moduleCatalog]
macApps = "GUI and AI apps (Raycast, Chrome, Claude)"
macosDefaults = "macOS system defaults (needs sudo)"
cloudAuth = "Cloud CLIs and auth walkthrough (gh, az, gcloud, op)"
claudePersona = "Claude persona at ~/.config/claude/CLAUDE.md"
theme = "Catppuccin Mocha across terminal and editor"
locale = "Norwegian locale (cSpell nb, bokmal dictionary)"
jvmStack = "JVM runtimes via mise (Temurin, Kotlin, Maven, Gradle)"
appleDev = "Swift/iOS dev (SwiftLint, SwiftFormat, xcbeautify, xcodes, fastlane)"

# effective = (inherit ? base : []) ∪ extra. .chezmoi.toml.tmpl restates this
# literally (renders before .chezmoidata loads); tests/data-model.bats enforces
# the two match.
[profileDefaults]
base = ["claudePersona", "jvmStack", "locale", "macApps", "macosDefaults", "theme"]

# minimal is deliberately empty.
[profileDefaults.inherit]
personal = true
work = true
minimal = false

[profileDefaults.extra]
personal = ["appleDev"]
work = ["cloudAuth"]
minimal = []
