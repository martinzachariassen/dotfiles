# Optional-module catalog — the one place the module list + human labels live.
#
# Selected at `chezmoi init` via a single promptMultichoiceOnce in
# .chezmoi.toml.tmpl; the chosen names land in `.modules` (a list). Templates gate
# on membership with sprig `has`, e.g. {{ if has "theme" .modules }}...{{ end }}.
# Prompts, the doctor report, and the apply summary all read these labels so the
# list is never restated.
#
# Keep this namespace (`moduleCatalog`) disjoint from prompted answers — see the
# note in packages.toml.

[moduleCatalog]
macApps = "GUI and AI apps (Raycast, Chrome, Claude)"
macosDefaults = "macOS system defaults (needs sudo)"
cloudAuth = "Cloud CLIs and auth walkthrough (gh, az, gcloud, op)"
claudePersona = "Claude persona at ~/.config/claude/CLAUDE.md"
theme = "Catppuccin Frappe across terminal and editor"
locale = "Norwegian locale (cSpell nb, bokmal dictionary)"
jvmStack = "JVM runtimes via mise (Temurin, Kotlin, Maven, Gradle)"

# Per-profile default module selection the wizard (scripts/bin/wizard.sh)
# pre-checks. Rather than restate every profile's full list, a profile's
# effective set is composed:
#
#     effective = (inherit ? base : []) ∪ extra
#
# so shared modules live once in `base` and each profile only spells out what's
# different — `work` adds cloudAuth, `minimal` opts out of the base entirely.
# scripts/bin/wizard.sh's profile_defaults() computes this; templates never see
# it (the config template renders before .chezmoidata loads, so .chezmoi.toml.tmpl
# still restates each profile's full effective list literally). The effective set
# MUST equal the $defaults blocks there — tests/data-model.bats enforces the match
# so the two never drift. Every name here must be a [moduleCatalog] key.
[profileDefaults]
base = ["claudePersona", "jvmStack", "locale", "macApps", "macosDefaults", "theme"]

# Whether a profile starts from `base`. minimal is the deliberately-empty base.
[profileDefaults.inherit]
personal = true
work = true
minimal = false

# Per-profile additions layered on top of the inherited base.
[profileDefaults.extra]
personal = []
work = ["cloudAuth"]
minimal = []
