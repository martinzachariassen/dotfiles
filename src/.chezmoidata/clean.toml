# Cleanup catalog for `chez clean` — keepHome/keepConfig/owners in one place so its
# two scopes (~/.config, top-level $HOME) can't drift apart.
#
# .chezmoidata can't be templated; keep this namespace disjoint from prompted
# answers (packages.toml/modules.toml) so merges don't collide.

[cleanup]
# Untracked ~/.config/X entries chez clean never offers to remove (auth material,
# chezmoi's own state, tool state we deliberately don't manage).
keepConfig = [
    "chezmoi",        # never remove — breaks chezmoi itself
    "op",             # 1Password CLI auth — also drives git commit signing
    "gh",
    "gcloud",
    "github-copilot",
    "carapace",       # sourced in .zshrc
    "lazygit",
    "homebrew",
    "gradle",
    "jgit",
    "kafkactl",       # not in any Brewfile; kept for the Macs that have it
    "obsidian",
    "raycast",
    "siyuan",
    ".wrangler",      # Cloudflare Wrangler
    "cagent",
]

# Top-level ~/.* entries chez clean never offers to remove. Everything else under a
# dot and untracked by chezmoi becomes a removal candidate.
keepHome = [
    ".storecode",         # installed by its own script, not brew — see storecode.toml
    ".ssh",               # private keys
    ".config",            # own scope, see keepConfig
    ".cache",
    ".local",
    ".docker",            # cli-plugins symlinks are managed; rest is runtime state
    ".swiftpm",           # SwiftPM state; ships with the Xcode toolchain, no `swiftpm` binary to match
    ".cups",
    ".CFUserTextEncoding",
    ".ctsystem",
    ".zshenv",
    ".Trash",             # emptying is a separate, manual action
]

# Tool-ownership map: chez clean keeps an entry (never offers it) while its owner is
# present — ANY of package (brew formula/cask), binary (on PATH), or extension (in
# `code --list-extensions`) is enough. Uninstall the tool and it becomes a removable
# orphan again.
#
# Only needed when the entry's own stem isn't already a command on PATH — e.g.
# .gradle, .minikube, .claude resolve automatically. This map is just the
# aliases where dir name and tool diverge.
[cleanup.owners]
[cleanup.owners.".azure"]
package = "azure-cli" # dir "azure" ≠ cmd "az"
binary = "az"
[cleanup.owners.".kube"]
package = "kubernetes-cli" # dir "kube" matches neither formula nor "kubectl"
binary = "kubectl"
[cleanup.owners.".m2"]
binary = "mvn" # Maven comes from mise, not brew
[cleanup.owners.".vscode"]
package = "visual-studio-code" # cask; dir "vscode" ≠ cmd "code"
binary = "code"

# Kept while the extension is installed (03 hook uninstalls it when dropped from
# the manifest).
[cleanup.owners.".sts4"]
extension = "vmware.vscode-spring-boot"
[cleanup.owners.".lemminx"]
extension = "redhat.vscode-xml"

# JVM tool caches — kept while mvn is on PATH, not extension-owned.
[cleanup.owners.".hawtjni"]
binary = "mvn"
[cleanup.owners.".pdfbox.cache"]
binary = "mvn"
[cleanup.owners.".rampart"]
binary = "mvn"
[cleanup.owners.".testcontainers.properties"]
binary = "mvn"
