# storecode — work-only security tool, installed by its OWN installer, NOT
# Homebrew (never belongs in a Brewfile). ~/.storecode is on cleanup.keepHome. See
# src/.chezmoiscripts/run_onchange_after_05-storecode.sh.tmpl (work profile only).

[storecode]
# Environment-specific installer, so it ships empty: unset means the hook prints
# how to finish and exits 0 rather than failing the apply. Set the real installer,
# e.g. "curl -fsSL https://…/install.sh | bash", then run `chezup`.
installCmd = ""
