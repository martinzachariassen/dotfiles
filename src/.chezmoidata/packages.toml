# Package catalog — which Brewfiles apply. Paths are relative to the repo root
# (git working tree), not chezmoi's src/ — hooks join them with
# {{ .chezmoi.workingTree }}.

[brewfiles]
core = "packages/Brewfile"

[brewfiles.byModule]
macApps = "packages/Brewfile.mac-apps"
appleDev = "packages/Brewfile.apple-dev"

[brewfiles.byProfile]
personal = "packages/Brewfile.personal"
work = "packages/Brewfile.work"
