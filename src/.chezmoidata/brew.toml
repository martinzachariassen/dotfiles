# Package catalog — which Brewfiles apply. Paths are relative to the repo root
# (git working tree), not chezmoi's src/ — hooks join them with
# {{ .chezmoi.workingTree }}.

[brewfiles]
core = "features/brew/Brewfile"

[brewfiles.byModule]
macApps = "features/brew/Brewfile.mac-apps"
appleDev = "features/brew/Brewfile.apple-dev"

# There is no per-profile tier any more. A machine that wants a package the repo
# does not declare says so in ~/.config/chez/Brewfile.local — one Mac's answer,
# kept on that Mac. See features/adopt/README.md.
