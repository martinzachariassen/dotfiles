name: install chezmoi
description: Install the chezmoi binary into ~/.local/bin and add it to PATH.
runs:
  using: composite
  steps:
    - name: Install chezmoi
      shell: bash
      run: |
        bin="$HOME/.local/bin"
        # Fetched fully before running (fails clean if truncated) — retries handle network blips.
        script="$(curl -fsLS --retry 3 --retry-delay 2 get.chezmoi.io)"
        sh -c "$script" -- -b "$bin"
        echo "$bin" >> "$GITHUB_PATH"
        # $GITHUB_PATH only applies to later steps — verify via full path now to fail fast.
        "$bin/chezmoi" --version
