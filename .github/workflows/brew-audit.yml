name: brew-audit

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '**/Brewfile'
      - 'tests/brewfiles.bats'

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs PR-controlled tests under a token with issues: write; keep it
          # out of .git/config.
          persist-credentials: false

      - name: Install tooling
        run: brew install bash bats-core dasel jq

      - name: Refresh Homebrew metadata
        run: brew update

      - name: make brew-audit
        id: audit
        run: make brew-audit 2>&1 | tee "$RUNNER_TEMP/audit.log"

      - name: Open or update an issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'brew-audit: a Brewfile no longer resolves'
        run: |
          body=$(printf '`make brew-audit` failed on %s.\n\n```\n%s\n```\n\n[run](%s/%s/actions/runs/%s)\n' \
            "$(date -u +%Y-%m-%d)" "$(cat "$RUNNER_TEMP/audit.log")" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
