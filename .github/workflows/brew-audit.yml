name: brew-audit

# Upstream state, not repo state: a package can be renamed, deprecated or
# withdrawn on a week nobody touches this repo. `make check` stays offline and
# blocks pull requests; this runs on its own clock and files an issue, so the
# news arrives without anyone watching a build.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - '**/Brewfile'
      - 'tests/brewfiles.bats'

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install tooling
        run: brew install bash bats-core dasel jq

      # Bottles and metadata both come from the API; without this the audit
      # would judge the runner's shipped snapshot rather than today's Homebrew.
      - name: Refresh Homebrew metadata
        run: brew update

      - name: make brew-audit
        id: audit
        run: make brew-audit 2>&1 | tee "$RUNNER_TEMP/audit.log"

      - name: Open or update an issue
        # Scheduled runs have nobody watching; a pull request already shows red.
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'brew-audit: a Brewfile no longer resolves'
        run: |
          body=$(printf '`make brew-audit` failed on %s.\n\n```\n%s\n```\n\n[run](%s/%s/actions/runs/%s)\n' \
            "$(date -u +%Y-%m-%d)" "$(cat "$RUNNER_TEMP/audit.log")" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
