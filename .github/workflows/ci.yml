name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly macOS render canary (Mondays 06:17 UTC). Catches macOS-only
    # template/path breakage before a real fresh-Mac install hits it. The
    # Linux jobs below run on every push/PR; the macOS render job is gated to
    # this schedule and manual dispatch (see its `if:`).
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: shell scripts ───────────────────────────────────────────────────
  # ShellCheck the plain shell scripts for errors. We deliberately do NOT lint
  # the .chezmoiscripts/*.sh.tmpl files — they have Go template directives
  # (e.g. `{{ if ne .chezmoi.os "darwin" }}exit 0{{ end }}`) that strip-and-
  # lint approaches mishandle (the bare `exit 0` makes everything below it
  # look unreachable to shellcheck). Those scripts are validated indirectly
  # by the chezmoi job below: rendering them via chezmoi catches Go template
  # syntax bugs, then bash parses the rendered script bodies.
  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shell tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck zsh

      - name: Lint plain shell scripts for errors
        run: shellcheck --severity=error --shell=bash install.sh scripts/*.sh scripts/lib/*.sh

      - name: Check shell parser syntax
        run: |
          bash -n install.sh scripts/*.sh scripts/lib/*.sh
          zsh -n dot_zshenv dot_config/zsh/dot_zprofile

  # ─── Job 2: chezmoi templates ───────────────────────────────────────────────
  # Renders every template in the repo. Catches Go template syntax errors,
  # undefined variables, stale references, and missing data prompts.
  #
  # Strategy: scripts/render-check.sh creates a temporary HOME with stub
  # chezmoi data, then runs `chezmoi apply --dry-run`. This bypasses
  # interactive prompts entirely and keeps the CI setup reproducible locally.
  chezmoi:
    name: chezmoi templates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [personal, work]
        mac_apps: [true, false]
        # Vary useOnePassword: it branches the git config + allowed_signers
        # templates (signing on/off). The false case is the no-1Password fork
        # path, which would otherwise never be rendered in CI.
        use_one_password: [true, false]
    steps:
      - uses: actions/checkout@v5

      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render every template via dry-run apply
        # `--dry-run` never writes to disk; it just resolves source state and
        # reports what would change. Any template parse error, undefined
        # variable, or template-helper misuse fails this step.
        #
        # The macOS-only chezmoi scripts (run_*-install-homebrew, brew-bundle,
        # vscode-extensions, macos-defaults) all have a `{{ if ne .chezmoi.os
        # "darwin" }}exit 0{{ end }}` guard, so they don't need any
        # macOS-specific tooling on this Linux runner — they just exit 0.
        env:
          PROFILE: ${{ matrix.profile }}
          MAC_APPS: ${{ matrix.mac_apps }}
          USE_ONE_PASSWORD: ${{ matrix.use_one_password }}
        run: bash scripts/render-check.sh "$PWD"

  # ─── Job 2b: shell unit tests (bats) ───────────────────────────────────────
  # Runs the bats-core suite in tests/ — covers the semver helper used by the
  # doctor's chezmoi-version gate and the real mkcd shell function extracted
  # from the zsh config template. Fast; runs on every push/PR.
  tests:
    name: shell unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install bats + zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats zsh

      - name: Run bats suite
        run: bats tests/

  # ─── Job 3: brew package names (macOS, blocking) ───────────────────────────
  # Resolve every referenced formula/cask. This catches dead names and broken
  # taps without installing anything, and should fail CI when the repo asks for
  # packages Homebrew cannot evaluate.
  brew-resolve:
    name: brew package names
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show brew version
        run: brew --version

      - name: Resolve formulae and casks (no install)
        run: bash scripts/brew-resolve.sh "$PWD"

  # ─── Job 4: brew installed-state smoke (macOS, advisory) ───────────────────
  # `brew bundle check` reports what is not installed on the runner. That is
  # useful drift signal, but GitHub-hosted macOS runners are slow and flaky, so
  # this job stays advisory while brew-resolve above is blocking.
  brew-check:
    name: brew bundle check
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Check every Brewfile module
        run: bash scripts/brew-check-modules.sh "$PWD"

  # ─── Job 5: macOS render canary (weekly / manual) ──────────────────────────
  # The Linux `chezmoi` job renders templates with the darwin-guarded scripts
  # short-circuiting to `exit 0`, so it never exercises the real macOS script
  # bodies (brew-bundle, vscode, macos-defaults, the sha256 `include`s). This
  # job runs the same render on a macOS runner where those guards fall through,
  # catching macOS-only template/path breakage before a fresh-Mac install does.
  # Gated to the weekly schedule + manual dispatch to keep PRs fast and cheap.
  render-macos:
    name: chezmoi render (macOS canary)
    runs-on: macos-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        profile: [personal, work]
    steps:
      - uses: actions/checkout@v5

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render every template via dry-run apply (macOS bodies)
        env:
          PROFILE: ${{ matrix.profile }}
          MAC_APPS: "true"
          USE_ONE_PASSWORD: "true"
        run: bash scripts/render-check.sh "$PWD"
