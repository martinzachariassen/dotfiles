name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly macOS render canary (Mondays 06:17 UTC) — catches macOS-only
    # template/path breakage the Linux jobs can't see (they short-circuit the
    # darwin-guarded hooks to `exit 0`).
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  # Include event_name so a push to main and the weekly schedule (which share
  # github.ref = refs/heads/main) land in different groups. And never cancel a
  # scheduled run — otherwise a push during the Monday window silently kills that
  # week's macOS render canary, which only runs on schedule.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # Lint plain shell scripts + check shell parser syntax. The src/.chezmoiscripts/
  # *.sh.tmpl files are intentionally excluded — their Go template directives
  # (e.g. `{{ if ne .chezmoi.os "darwin" }}exit 0{{ end }}`) confuse shellcheck.
  # They're validated by `render` (template syntax) + `test` (rendered bodies).
  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck shfmt zsh
      - name: ShellCheck
        run: shellcheck --severity=error --shell=bash install.sh scripts/bin/*.sh scripts/ci/*.sh scripts/lib/*.sh
      - name: shfmt
        run: shfmt -d -i 4 -ci install.sh scripts/bin/*.sh scripts/ci/*.sh scripts/lib/*.sh
      - name: Parser syntax
        # bash -n / zsh -n only parse their FIRST argument, so each file must be
        # checked on its own — a bare `bash -n a b c` silently skips b and c.
        run: |
          for f in install.sh scripts/bin/*.sh scripts/ci/*.sh scripts/lib/*.sh; do bash -n "$f"; done
          for f in src/dot_zshenv src/dot_config/zsh/dot_zprofile; do zsh -n "$f"; done

  # Render every template via `chezmoi apply --dry-run` against stub data — no
  # disk writes, no interactive prompts. Catches Go-template syntax errors,
  # undefined variables, and stale references. The curated matrix exercises both
  # values of each data axis that branches a template: profile (personal/work),
  # features.macApps, and useOnePassword (git signing on/off, the fork path).
  render:
    name: chezmoi render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: personal, mac_apps: true,  use_one_password: true }
          - { profile: work,     mac_apps: true,  use_one_password: true }
          - { profile: personal, mac_apps: false, use_one_password: true }
          - { profile: personal, mac_apps: true,  use_one_password: false }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - uses: ./.github/actions/install-chezmoi
      - name: Dry-run apply
        env:
          PROFILE: ${{ matrix.profile }}
          MAC_APPS: ${{ matrix.mac_apps }}
          USE_ONE_PASSWORD: ${{ matrix.use_one_password }}
        run: bash scripts/ci/render-check.sh "$PWD"

  # bats-core suite in tests/: semver helper, shell functions, mise config,
  # obsidian-apply, and the static + dynamic checks on every chezmoi hook
  # (chezmoi-scripts.bats renders each hook and runs it on Linux to confirm the
  # darwin guard fires before any macOS-only command — hence chezmoi here).
  test:
    name: shell unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bats zsh
      - uses: ./.github/actions/install-chezmoi
      - run: bats tests/

  # Validate every JSON / JSONC (VS Code) / TOML output parses as the language it
  # claims to be. `render` proves templates render; this proves outputs are valid.
  config:
    name: config files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - run: bash scripts/ci/lint-config.sh "$PWD"

  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: crate-ci/typos@37bb98842b0d8c4ffebdb75301a13db0267cef89 # v1.47.2

  # Conventional Commits PR title (subject 1-72 chars). PR-only.
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            perf
            build
            ci
            style
          requireScope: false
          subjectPattern: ^.{1,72}$
          subjectPatternError: |
            PR title subject must be 1-72 characters (Conventional Commits).

  # Resolve every Brewfile formula/cask name without installing (blocking), then
  # report installed-state drift (advisory — hosted macOS runners are slow/flaky).
  brew:
    name: brew packages
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Resolve names (no install)
        run: bash scripts/ci/brew-resolve.sh "$PWD"
      - name: Bundle check (advisory)
        continue-on-error: true
        run: bash scripts/ci/brew-check-modules.sh "$PWD"

  # The Linux `render` job never executes the real macOS hook bodies (the darwin
  # guards exit 0). This re-runs the render on macOS where those guards fall
  # through. Gated to the weekly schedule + manual dispatch to keep PRs fast.
  render-macos:
    name: chezmoi render (macOS canary)
    runs-on: macos-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        profile: [personal, work]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-chezmoi
      - env:
          PROFILE: ${{ matrix.profile }}
          MAC_APPS: "true"
          USE_ONE_PASSWORD: "true"
        run: bash scripts/ci/render-check.sh "$PWD"
