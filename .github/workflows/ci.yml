name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly macOS canary — Linux jobs short-circuit darwin-guarded hooks to `exit 0`.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  # event_name splits push-to-main from the weekly schedule (same github.ref).
  # Never cancel a scheduled run — a push during the window would kill the canary.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # .chezmoiscripts/*.sh.tmpl excluded — Go template directives confuse shellcheck;
  # covered instead by `render` (syntax) + `test` (rendered bodies).
  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck shfmt zsh
      - name: ShellCheck
        run: shellcheck --severity=error --shell=bash install.sh scripts/bin/*.sh scripts/ci/*.sh scripts/lib/*.sh
      - name: shfmt
        run: shfmt -d -i 4 -ci install.sh scripts/bin/*.sh scripts/ci/*.sh scripts/lib/*.sh
      - name: Parser syntax
        # bash -n / zsh -n only parse their first arg — loop, don't pass multiple files.
        run: |
          for f in install.sh scripts/bin/*.sh scripts/ci/*.sh scripts/lib/*.sh; do bash -n "$f"; done
          for f in src/dot_zshenv src/dot_config/zsh/dot_zprofile; do zsh -n "$f"; done

  # `chezmoi apply --dry-run` against stub data — no disk writes, no prompts.
  # Matrix exercises both values of each branching axis: profile, macApps, useOnePassword.
  render:
    name: chezmoi render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: personal, mac_apps: true,  use_one_password: true }
          - { profile: work,     mac_apps: true,  use_one_password: true }
          - { profile: personal, mac_apps: false, use_one_password: true }
          - { profile: personal, mac_apps: true,  use_one_password: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - uses: ./.github/actions/install-chezmoi
      - name: Dry-run apply
        env:
          PROFILE: ${{ matrix.profile }}
          MAC_APPS: ${{ matrix.mac_apps }}
          USE_ONE_PASSWORD: ${{ matrix.use_one_password }}
        run: bash scripts/ci/render-check.sh "$PWD"

  # chezmoi-scripts.bats renders + runs each hook on Linux to confirm the darwin guard fires first.
  test:
    name: shell unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bats zsh
      - uses: ./.github/actions/install-chezmoi
      - run: bats tests/

  # `render` proves templates render; this proves the JSON/JSONC/TOML output is valid.
  config:
    name: config files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/ci/lint-config.sh "$PWD"

  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

  # Run via resolved GOPATH/bin, never $GITHUB_PATH, to avoid a code-exec sink.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan working tree
        run: |
          bin="$(go env GOPATH)/bin"
          "$bin/gitleaks" dir . --redact --no-banner

  # Also lints bash embedded in `run:` steps via the runner's preinstalled shellcheck.
  actionlint:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows
        run: |
          bin="$(go env GOPATH)/bin"
          "$bin/actionlint" -color

  # Read-only GITHUB_TOKEN lets zizmor verify each action's pin against upstream tags.
  zizmor:
    name: workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pipx run --spec zizmor==1.27.0 zizmor .github/workflows/

  # Conventional Commits PR title (subject 1-72 chars). PR-only.
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            perf
            build
            ci
            style
          requireScope: false
          subjectPattern: ^.{1,72}$
          subjectPatternError: |
            PR title subject must be 1-72 characters (Conventional Commits).

  # Resolve step blocks; drift-check is advisory only (hosted macOS runners are flaky).
  brew:
    name: brew packages
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve names (no install)
        run: bash scripts/ci/brew-resolve.sh "$PWD"
      - name: Bundle check (advisory)
        continue-on-error: true
        run: bash scripts/ci/brew-check-modules.sh "$PWD"

  # Re-runs render on macOS, where the darwin guards actually fall through (Linux `render` can't).
  # Gated to schedule + manual dispatch to keep PRs fast.
  render-macos:
    name: chezmoi render (macOS canary)
    runs-on: macos-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        profile: [personal, work]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-chezmoi
      - env:
          PROFILE: ${{ matrix.profile }}
          MAC_APPS: "true"
          USE_ONE_PASSWORD: "true"
        run: bash scripts/ci/render-check.sh "$PWD"
