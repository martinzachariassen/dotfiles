name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # macOS: the tests exercise BSD find, stat and readlink.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        # bash: the runner's /bin/bash is 3.2, and the suite must run under 5.
        run: brew install bash bats-core dasel jq shellcheck shfmt taplo

      - name: make check
        run: make check
