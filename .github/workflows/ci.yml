name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: shell scripts ───────────────────────────────────────────────────
  # shellcheck the plain shell scripts. We deliberately do NOT lint the
  # .chezmoiscripts/*.sh.tmpl files — they have Go template directives
  # (e.g. `{{ if ne .chezmoi.os "darwin" }}exit 0{{ end }}`) that strip-and-
  # lint approaches mishandle (the bare `exit 0` makes everything below it
  # look unreachable to shellcheck). Those scripts are validated indirectly
  # by the chezmoi job below: rendering them via chezmoi catches Go template
  # syntax bugs, and a bash syntax bug would also fail rendering.
  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Lint plain shell scripts
        run: shellcheck --shell=bash install.sh macos-defaults.sh doctor.sh bootstrap-auth.sh

  # ─── Job 2: chezmoi templates ───────────────────────────────────────────────
  # Renders every template in the repo. Catches Go template syntax errors,
  # undefined variables, stale references, and missing data prompts.
  #
  # Strategy: write `~/.config/chezmoi/chezmoi.toml` directly with stub data,
  # then run `chezmoi apply --dry-run`. This bypasses `chezmoi init`'s
  # interactive prompts entirely — independent of which `--prompt*` CLI
  # flags the installed chezmoi version supports.
  chezmoi:
    name: chezmoi templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pre-populate chezmoi config with stub data
        # Mirrors what `chezmoi init` would render from .chezmoi.toml.tmpl,
        # but skips the interactive prompts. profile="both" ensures BOTH
        # profile-conditional template branches (work + personal) get
        # exercised by the dry-run below.
        run: |
          mkdir -p "$HOME/.config/chezmoi"
          cat > "$HOME/.config/chezmoi/chezmoi.toml" <<EOF
          sourceDir = "$PWD"

          [data]
              name       = "CI"
              email      = "ci@example.com"
              signingKey = "ssh-ed25519 AAAAci-placeholder"
              profile    = "both"
          EOF

      - name: Render every template via dry-run apply
        # `--dry-run` never writes to disk; it just resolves source state and
        # reports what would change. Any template parse error, undefined
        # variable, or template-helper misuse fails this step.
        #
        # The macOS-only chezmoi scripts (run_*-install-homebrew, brew-bundle,
        # vscode-extensions, macos-defaults) all have a `{{ if ne .chezmoi.os
        # "darwin" }}exit 0{{ end }}` guard, so they don't need any
        # macOS-specific tooling on this Linux runner — they just exit 0.
        run: chezmoi apply --dry-run --verbose

  # ─── Job 3: brew bundle sanity (macOS) ──────────────────────────────────────
  # Runs `brew bundle check` against all three Brewfiles on a real macOS
  # runner. Catches deprecated/renamed casks, removed taps, and other things
  # that only fail when Homebrew evaluates the Brewfile.
  #
  # `continue-on-error: true` because GitHub-hosted macOS runners are slow,
  # rate-limited, and flaky for brew operations — we want signal, not red CI
  # every time Homebrew's CDN coughs.
  brew:
    name: brew bundle (macOS)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Show brew version
        run: brew --version

      # `brew bundle check` reports what's missing; with `--verbose` it lists
      # each tap/brew/cask. A bad cask name (e.g. an old "google-cloud-sdk")
      # produces a non-zero exit and a clear error.
      - name: Check common Brewfile
        run: brew bundle check --verbose --file=Brewfile || true

      - name: Check Brewfile.personal
        run: brew bundle check --verbose --file=Brewfile.personal || true

      - name: Check Brewfile.work
        run: brew bundle check --verbose --file=Brewfile.work || true

      # Stronger signal than `check`: actually try to resolve every formula and
      # cask. If a name is dead, brew exits with a parse error here.
      - name: Resolve formulae and casks (no install)
        run: |
          set -e
          # Strip comments and blank lines, then verify each `brew "X"` /
          # `cask "X"` actually exists in homebrew-core or a tap we use.
          for f in Brewfile Brewfile.personal Brewfile.work; do
            echo "── $f ──"
            grep -E '^(brew|cask) "' "$f" | while read -r line; do
              name=$(echo "$line" | sed -E 's/^(brew|cask) "([^"]+)".*/\2/')
              kind=$(echo "$line" | awk '{print $1}')
              if [ "$kind" = "brew" ]; then
                brew info --formula "$name" >/dev/null 2>&1 \
                  || echo "  ✗ formula not found: $name"
              else
                brew info --cask "$name" >/dev/null 2>&1 \
                  || echo "  ✗ cask not found: $name"
              fi
            done
          done
