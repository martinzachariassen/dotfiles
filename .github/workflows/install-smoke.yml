name: install-smoke

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'install.sh'
      - 'bin/dot'
      - 'lib/**'
      - 'core/**'
      - '.github/workflows/install-smoke.yml'
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Seed a config
        run: |
          mkdir -p ~/.config/dotfiles
          cat > ~/.config/dotfiles/config.toml <<'EOF'
          schema = 1

          [user]
          name  = "CI"
          email = "ci@example.invalid"

          [modules]
          enabled = [
            "zsh",
          ]
          EOF

      - name: Run install.sh
        shell: bash
        env:
          DOTFILES_REPO: ${{ github.workspace }}
          DOTFILES_DIR: ${{ runner.temp }}/dotfiles
        run: |
          script -q /dev/null bash install.sh </dev/null 2>&1 |
            tee "$RUNNER_TEMP/install.log"

      - name: It reached the handoff, and the handoff worked
        env:
          DOTFILES_DIR: ${{ runner.temp }}/dotfiles
        run: |
          grep -q '5/5' "$RUNNER_TEMP/install.log"
          [ -d "$DOTFILES_DIR/.git" ]
          [ -x "$HOME/.local/bin/dot" ]
          [ -L "$HOME/.zshenv" ]
          ls "$HOME/.local/state/dotfiles/logs/"*-apply.log

      - name: The machine it made passes its own checks
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          dot doctor
