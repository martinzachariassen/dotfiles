<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">dotfiles</title>
  <desc id="desc">My Mac as code. A terminal shows dot doctor reporting that everything looks right.</desc>
  <style>
    .bg { fill: #f6f8fa; }
    .grid { stroke: #1f2328; stroke-opacity: 0.05; }
    .fg { fill: #1f2328; }
    .muted { fill: #59636e; }
    .accent { fill: #0969da; }
    .ok { fill: #1a7f37; }
    .warn { fill: #9a6700; }
    .rule { fill: #8c959f; }
    .term { fill: #ffffff; stroke: #d0d7de; }
    .bar { fill: #eaeef2; }
    .pill { fill: #ffffff; stroke: #d0d7de; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .grid { stroke: #e6edf3; stroke-opacity: 0.05; }
      .fg { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .accent { fill: #4493f8; }
      .ok { fill: #3fb950; }
      .warn { fill: #d29922; }
      .rule { fill: #656c76; }
      .term { fill: #161b22; stroke: #30363d; }
      .bar { fill: #21262d; }
      .pill { fill: #161b22; stroke: #30363d; }
    }
  </style>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path class="grid" d="M 32 0 L 0 0 0 32" fill="none" stroke-width="1"/>
    </pattern>
  </defs>

  <rect class="bg" width="1280" height="360"/>
  <rect width="1280" height="360" fill="url(#grid)"/>

  <g transform="translate(80 0)">
    <text class="mono fg" x="0" y="166" font-size="64" font-weight="700"><tspan class="accent">.</tspan>dotfiles</text>
    <text class="sans fg" x="2" y="210" font-size="26" font-weight="600">My Mac as code.</text>
    <text class="sans muted" x="2" y="246" font-size="18">Packages, config files and macOS settings,</text>
    <text class="sans muted" x="2" y="272" font-size="18">applied with one command and checked with another.</text>
  </g>

  <g transform="translate(600 44)">
    <rect class="term" x="0" y="0" width="620" height="272" rx="10" stroke-width="1"/>
    <path class="bar" d="M 10 0.5 H 610 A 9.5 9.5 0 0 1 619.5 10 V 34 H 0.5 V 10 A 9.5 9.5 0 0 1 10 0.5 Z"/>
    <circle cx="22" cy="17" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="17" r="6" fill="#febc2e"/>
    <circle cx="62" cy="17" r="6" fill="#28c840"/>
    <text class="mono muted" x="310" y="22" font-size="12" text-anchor="middle">zsh</text>

    <g class="mono" font-size="13">
      <text x="20" y="62"><tspan class="ok">$</tspan><tspan class="fg"> dot doctor</tspan></text>
      <rect class="rule" x="20" y="85" width="18" height="1"/>
      <text class="fg" x="46" y="90" font-weight="700">Checking</text>
      <rect class="rule" x="122" y="85" width="340" height="1"/>
      <text class="muted" x="600" y="90" text-anchor="end">core + 9 modules</text>
      <text class="ok" x="36" y="114">✓</text><text class="fg" x="58" y="114">core</text><text class="muted" x="184" y="114">the repo, the shim, the config</text>
      <text class="ok" x="36" y="134">✓</text><text class="fg" x="58" y="134">git</text><text class="muted" x="184" y="134">Git config, aliases, and a machine-local include</text>
      <text class="ok" x="36" y="154">✓</text><text class="fg" x="58" y="154">macos-defaults</text><text class="muted" x="184" y="154">macOS preferences: Dock, Finder, input, screenshots</text>
      <text class="ok" x="36" y="174">✓</text><text class="fg" x="58" y="174">zsh</text><text class="muted" x="184" y="174">zsh with XDG layout, aliases, PATH and prompt</text>
      <text class="ok" x="36" y="194">✓</text><text class="fg" x="58" y="194">orphans</text><text class="muted" x="184" y="194">none</text>
      <rect class="rule" x="20" y="219" width="18" height="1"/>
      <text class="fg" x="46" y="224" font-weight="700">Result</text>
      <rect class="rule" x="106" y="219" width="494" height="1"/>
      <text class="ok" x="36" y="248">✓</text><text class="ok" x="58" y="248">Everything looks right.</text>
    </g>
  </g>
</svg>
