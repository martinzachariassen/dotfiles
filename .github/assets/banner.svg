<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">dotfiles</title>
  <desc id="desc">My Mac as code. A terminal shows dot apply installing Discord, with a live progress bar.</desc>
  <style>.bg{fill:#f6f8fa} .grid{stroke:#1f2328;stroke-opacity:.05} .fg{fill:#1f2328}
.muted{fill:#59636e} .accent{fill:#0969da} .ok{fill:#1a7f37} .warn{fill:#9a6700}
.rule{fill:#8c959f} .term{fill:#ffffff;stroke:#d0d7de} .bar{fill:#eaeef2}
.track{fill:#d8dee4} .okb{fill:#1a7f37} .pill{fill:#ffffff;stroke:#d0d7de}
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
text{white-space:pre}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){.bg{fill:#0d1117} .grid{stroke:#e6edf3;stroke-opacity:.05} .fg{fill:#e6edf3}
.muted{fill:#9198a1} .accent{fill:#4493f8} .ok{fill:#3fb950} .warn{fill:#d29922}
.rule{fill:#656c76} .term{fill:#161b22;stroke:#30363d} .bar{fill:#21262d}
.track{fill:#30363d} .okb{fill:#3fb950} .pill{fill:#161b22;stroke:#30363d}}</style>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path class="grid" d="M 32 0 L 0 0 0 32" fill="none" stroke-width="1"/></pattern></defs>
  <rect class="bg" width="1280" height="360"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <g transform="translate(80 0)">
    <text class="mono fg" x="0" y="166" font-size="64" font-weight="700"><tspan class="accent">.</tspan>dotfiles</text>
    <text class="sans fg" x="2" y="210" font-size="26" font-weight="600">My Mac as code.</text>
    <text class="sans muted" x="2" y="246" font-size="18">Packages, config files and macOS settings,</text>
    <text class="sans muted" x="2" y="272" font-size="18">applied with one command and checked with another.</text>
  </g><g transform="translate(600 35)">
