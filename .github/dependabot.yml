version: 2

# Keep the third-party GitHub Actions used in ci.yml current. Dependabot opens a
# PR per outdated `uses:` pin; the repo's own CI (and the Conventional-Commit PR
# title check) gate the bump before it can merge. Local composite actions
# (./.github/actions/*) and the `curl get.chezmoi.io` installer aren't version
# pins, so there's nothing here for them to bump.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    # One grouped PR for all action bumps instead of up to three separate ones.
    groups:
      github-actions:
        patterns: ["*"]
    # Let a release settle before proposing it — dodges yanked/hotfixed tags.
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: ci
      include: scope
    labels: ["dependencies"]
