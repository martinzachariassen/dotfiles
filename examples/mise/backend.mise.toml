# backend.mise.toml — starter mise config for a JVM backend service.
#
# Copy into a project root as `mise.toml`, edit, and commit it. On `cd` into
# the project, `mise activate` (wired into ~/.config/zsh/.zshrc) switches to
# these versions and exports the [env] vars below. A teammate who clones the
# repo gets the identical toolchain after one `mise install`.
#
#   cp ~/Developer/personal/dotfiles/examples/mise/backend.mise.toml /path/to/project/mise.toml
#   cd /path/to/project && mise install

[tools]
# Pin the exact runtimes this service builds and runs on. These OVERRIDE the
# global defaults in ~/.config/mise/config.toml for this directory tree only.
java = "temurin-21"     # or "temurin-25"; matches the Gradle/Maven toolchain
node = "lts"            # frontend assets / tooling
python = "3.13"         # scripts, pre-commit, etc.

[env]
# Per-project environment variables — this section replaces what direnv's
# .envrc used to do. Loaded automatically on cd, unloaded on the way out.
SPRING_PROFILES_ACTIVE = "local"
# Prepend a project-local bin dir to PATH (mise's equivalent of `PATH_add`):
_.path = ["./bin"]
# For secrets, prefer a gitignored mise.local.toml (see ~/.config/git/ignore)
# or a secret-manager reference — never commit real values here.

[tasks.dev]
description = "Run the service locally"
run = "./gradlew bootRun"

# Notes
# - Database servers (Postgres, Redis) and CLIs (kubectl, terraform) are NOT
#   managed here — mise owns language runtimes. Run datastores via Docker /
#   Testcontainers and install CLIs through Homebrew.
# - The Java *version* is pinned both here and in the build tool's toolchain
#   (Gradle `java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }`
#   or Maven `<maven.compiler.release>`), which is where CI reads it from.
